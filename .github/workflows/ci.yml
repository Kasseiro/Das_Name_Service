name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      # Lint only once the build exists: both tools fail on a missing directory.
      - name: Ruff
        if: hashFiles('dnsd/**/*.py') != ''
        run: ruff check dnsd

      - name: Bandit
        if: hashFiles('dnsd/**/*.py') != ''
        run: bandit -r dnsd

      - name: Tests
        run: pytest tests --impl . --junitxml=results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.xml
